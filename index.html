<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 교육 피드</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail expanded" aria-label="주요 메뉴">
        <div class="rail-brand"><div class="rail-logo">AI</div><strong>AI 교육피드</strong></div>
        <button class="rail-button active" data-view="feed" type="button"><span>⌂</span><strong>홈</strong></button>
        <button class="rail-button" data-view="search" type="button"><span>⌕</span><strong>검색</strong></button>
        <button class="rail-button" data-action="compose-focus" type="button"><span>＋</span><strong>글쓰기</strong></button>
        <button class="rail-button" data-view="feed" type="button"><span>?</span><strong>질문</strong></button>
        <button class="rail-button" data-view="progress" type="button"><span>▤</span><strong>대시보드</strong></button>
        <button class="rail-button" data-action="profile" type="button"><span>●</span><strong>프로필</strong></button>
        <button id="resetDemo" class="rail-button rail-bottom" type="button"><span>↺</span><strong>초기화</strong></button>
      </aside>

      <main class="feed-layout">
        <section class="feed-column">
          <header class="mobile-header">
            <strong>AI 교육 피드</strong>
            <select id="currentUserMobile"></select>
          </header>

          <section id="feedView" class="view active">
            <div class="filter-row" role="group" aria-label="피드 필터">
              <button class="filter-chip active" data-filter="all" type="button">전체</button>
              <button class="filter-chip" data-filter="general" type="button">일반</button>
              <button class="filter-chip" data-filter="notice" type="button">공지</button>
              <button class="filter-chip" data-filter="mission" type="button">미션</button>
              <button class="filter-chip" data-filter="question" type="button">질문</button>
            </div>
            <div id="postList" class="post-stack"></div>
          </section>

          <section id="searchView" class="view">
            <div class="search-panel">
              <h2>검색</h2>
              <input id="globalSearch" class="search-input" placeholder="게시글, 공지, 미션, 질문 검색" />
            </div>
            <div id="searchResults" class="post-stack"></div>
          </section>

          <section id="progressView" class="view">
            <div class="progress-sections">
              <section><h2>참가자별 확인</h2><div id="userProgress" class="post-stack"></div></section>
              <section><h2>게시물별 확인</h2><div id="postProgress" class="post-stack"></div></section>
            </div>
          </section>
        </section>

        <aside class="side-panel">
          <div class="profile-card"><div class="avatar current" id="currentAvatar">운</div><div><strong id="currentName">교육 운영자</strong><span id="currentRole">admin</span></div></div>
          <div class="account-actions"><button class="ghost-button" type="button">로그아웃</button><label for="currentUser">계정 전환</label><select id="currentUser"></select></div>
          <div id="quickStats" class="panel-block stats"></div>
        </aside>
      </main>
    </div>

    <div id="composeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
      <div class="modal-backdrop" data-action="close-compose"></div>
      <section class="compose-dialog">
        <header class="compose-header">
          <button class="modal-close" data-action="close-compose" type="button" aria-label="닫기">×</button>
          <h2 id="composeTitle">새 게시물 만들기</h2>
          <span></span>
        </header>
        <form id="postForm" class="modal-form">
          <div class="upload-drop">
            <div class="upload-icon">▧</div>
            <strong>게시글 유형과 첨부를 한 번에 선택하세요</strong>
            <p>일반, 공지, 미션, 질문 모두 같은 폼으로 작성하고 파일/이미지/영상 링크를 첨부할 수 있습니다.</p>
          </div>
          <select name="type" aria-label="글 유형">
            <option value="general">일반 게시글</option>
            <option value="notice">공지</option>
            <option value="mission">미션</option>
            <option value="question">질문</option>
          </select>
          <input name="title" placeholder="제목" required />
          <textarea name="body" placeholder="내용" required></textarea>
          <input name="mediaUrl" placeholder="영상/HTML/이미지 링크" />
          <input name="attachmentUrl" placeholder="첨부파일 다운로드 링크" />
          <p class="form-help">질문도 피드에 올라가며 댓글로 답변을 받을 수 있습니다.</p>
          <button type="submit">게시</button>
        </form>
      </section>
    </div>

    <template id="emptyTemplate"><div class="empty">아직 등록된 내용이 없습니다.</div></template>
    <script src="app-state.js"></script>
    <script src="app.js"></script>
  </body>
</html>
