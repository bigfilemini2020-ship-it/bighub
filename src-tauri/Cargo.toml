[package]
name = "bighub"
version = "0.1.0"
description = "BigHub desktop app"
authors = ["Bigfile"]
edition = "2021"

[lib]
name = "bighub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
